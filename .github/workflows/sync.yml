name: Sync to Public Frontend

on:
  push:
    branches: [ main ]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout private repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove sensitive files
        run: |
          rm -f token data.json

      - name: Push to public repository
        env:
          PAT: ${{ secrets.GH_PAT_PUBLIC }}
        run: |
          git config --global user.name "Aviv-Cyber"
          git config --global user.email "avivyl1234@gmail.com"
          git remote add public https://x-access-token:${PAT}@github.com/Aviv-Cyber/mishloo.git
          git push public main --force