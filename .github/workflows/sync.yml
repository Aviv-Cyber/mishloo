name: Sync to Public Frontend & Data

on:
  push:
    branches: [ main ]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout private repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare public data (Strip sensitive fields)
        run: |
          # כאן אפשר לסנן את data.json בעזרת jq או סקריפט פייתון/באש 
          # כדי לוודא שרק הנתונים שהאתר הפומבי צריך נשארים בקובץ החדש
          if [ -f "data.json" ]; then
            # דוגמה: העתקת רק שדות מותרים או שמירת עותק נקי
            cp data.json public-data.json
          else
            echo "{}" > public-data.json
          fi

      - name: Remove sensitive files before pushing
        run: |
          rm -f token data.json

      - name: Push to public repository
        env:
          PAT: ${{ secrets.GH_PAT_PUBLIC }}
        run: |
          git config --global user.name "Aviv-Cyber"
          git config --global user.email "avivyl1234@gmail.com"
          git remote add public https://x-access-token:${PAT}@github.com/Aviv-Cyber/mishloo.git
          
          # נוודא שהקובץ הציבורי כן עולה לריפו הפומבי
          git add public-data.json
          git commit -m "Auto-update public data" || true
          
          git push public main --force